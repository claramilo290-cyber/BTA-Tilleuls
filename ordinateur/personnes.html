<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<title>Recherche personnes</title>

<link rel="stylesheet" href="ordinateur.css">

</head>


<body>


<h1>👤 Base personnes</h1>


<input id="recherche" placeholder="Nom ou prénom">


<button onclick="chercher()">
Rechercher
</button>


<div id="resultats"></div>



<script src="base_personnes.js"></script>


<script>


function chercher(){


let recherche =
document.getElementById("recherche")
.value
.toLowerCase();



let resultat =
personnes.filter(p =>

p.nom.toLowerCase().includes(recherche)
||
p.prenom.toLowerCase().includes(recherche)

);



document.getElementById("resultats").innerHTML =

resultat.map(p=>`

<div>

<h2>${p.prenom} ${p.nom}</h2>

<p>Date naissance : ${p.dateNaissance}</p>

<p>Lieu naissance : ${p.lieuNaissance}</p>

<p>Ville : ${p.ville}</p>

<p>Profession : ${p.profession}</p>

<p>Téléphone : ${p.telephone}</p>

<p>Antécédents : ${p.antecedents}</p>

<p>Recherche : ${p.recherche}</p>


</div>

`).join("");


}


</script>


</body>
</html>
