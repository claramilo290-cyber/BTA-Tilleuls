<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Fichier personnes - Affaire 2026/593</title>

<link rel="stylesheet" href="../style.css">

</head>


<body>


<div class="page_dossier">


<h1>👥 Fichier des personnes</h1>

<h2>Affaire 2026/593 - Les Tilleuls</h2>


<input 
id="recherche"
type="text"
placeholder="Rechercher une personne..."
onkeyup="chercher()"
>



<div id="listePersonnes"></div>



<br>


<button onclick="retour()">

⬅ Retour bureau

</button>


</div>




<script src="base_personnes.js"></script>


<script>


function afficher(liste){


let zone =
document.getElementById("listePersonnes");


zone.innerHTML="";



liste.forEach(function(personne){



zone.innerHTML += `


<div class="carte">


<h3>${personne.prenom} ${personne.nom}</h3>


<p>
Âge : ${personne.age}
</p>


<p>
Statut : ${personne.statut}
</p>


<p>
Lien enquête :
<br>
${personne.lien}
</p>


<button onclick="voirFiche(${personne.id})">

Voir fiche

</button>


</div>


`;



});


}





function chercher(){


let texte =
document
.getElementById("recherche")
.value
.toLowerCase();



let resultat =
personnes.filter(function(p){


return (

p.nom.toLowerCase().includes(texte)

||

p.prenom.toLowerCase().includes(texte)

);



});



afficher(resultat);



}





function voirFiche(id){


let p =
personnes.find(x=>x.id===id);



alert(

"FICHE PERSONNE\n\n"+

p.prenom+" "+p.nom+

"\n\nAge : "+p.age+

"\nStatut : "+p.statut+

"\nLien enquête : "+p.lien+

"\nNotes : "+p.notes

);



}





function retour(){

window.location.href="bureau.html";

}




afficher(personnes);



</script>



</body>

</html>
